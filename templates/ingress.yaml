{{- $fullName := include "..fullname" . -}}
{{- if .Values.ingress.enabled }}
{{- include "..ingress" (dict "ctx" $ "name" $fullName "ing" .Values.ingress) }}
{{- end }}
{{- range .Values.extraIngresses }}
{{- if not .name }}
{{- fail "extraIngresses: every entry needs a `name` (the Ingress is named <fullname>-<name>)" }}
{{- end }}
---
{{ include "..ingress" (dict "ctx" $ "name" (printf "%s-%s" $fullName .name) "ing" .) }}
{{- end }}
