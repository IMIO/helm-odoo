{{- if .Values.externalsecrets.enabled }}
{{- if .Values.postgresql.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "..fullname" . }}-postgresql-secret
  # Provision as a pre-install/pre-upgrade hook so the operator syncs the target
  # Secret during the pre-install phase — before the init/update hook Jobs run.
  # The Jobs' mount waits (kubelet retries) until the synced Secret appears.
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  secretStoreRef:
    name: {{ tpl (.Values.externalsecrets.secretStoreRef.name | toString) $ }}
    kind: SecretStore
  target:
    name: {{ include "..fullname" . }}-postgresql-secret
    template:
      metadata:
        labels: {}
  data:
  - secretKey: postgresql-password
    remoteRef:
      key: {{ tpl (.Values.externalsecrets.postgresqlKey | toString) $ }}
      property: {{ .Values.externalsecrets.properties.postgresql.password | default "postgresql-password" }}
  - secretKey: postgresql-admin-password
    remoteRef:
      key: {{ tpl (.Values.externalsecrets.postgresqlKey | toString) $ }}
      property: {{ .Values.externalsecrets.properties.postgresql.adminPassword | default "postgresql-admin-password" }}
---
{{- end }}
{{- $odooConf := include "..odooConf" (dict "Values" .Values "dbHost" (include "..dbHost" .) "dbPort" (include "..dbPort" .) "dbName" (include "..dbName" .) "dbUser" (include "..dbUser" .) "dbPassword" "{{ .postgresqlPassword }}" "adminPasswd" "{{ .odooAdminPasswd }}") }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "..fullname" . }}-odoo-conf-secret
spec:
  secretStoreRef:
    name: {{ tpl (.Values.externalsecrets.secretStoreRef.name | toString) $ }}
    kind: SecretStore
  target:
    name: {{ include "..fullname" . }}-odoo-conf
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels: {}
      data:
        odoo.conf: |
{{ $odooConf | indent 10 }}
  data:
  {{- include "..externalsecrets.odooConfData" . | nindent 2 }}
{{- if or .Values.odoo.init.enabled .Values.odoo.update.enabled }}
---
# Hook copy for the init/update Jobs. Rendered as a pre-install/pre-upgrade hook so
# the operator syncs <fullname>-odoo-conf-hook during the pre-install phase — before
# the Jobs run; the Job's mount then retries (kubelet) until it appears. Gated on
# init/update — only needed when a Job actually runs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "..fullname" . }}-odoo-conf-hook-secret
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  secretStoreRef:
    name: {{ tpl (.Values.externalsecrets.secretStoreRef.name | toString) $ }}
    kind: SecretStore
  target:
    name: {{ include "..fullname" . }}-odoo-conf-hook
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels: {}
      data:
        odoo.conf: |
{{ $odooConf | indent 10 }}
  data:
  {{- include "..externalsecrets.odooConfData" . | nindent 2 }}
{{- end }}
{{- if .Values.externalsecrets.s3 }}
{{- fail "externalsecrets.s3 was removed in 4.0.0: move it to externalsecrets.extraSecrets.s3 (`key` + an explicit `env` map), see the \"To 4.0.0\" upgrade note in the README" }}
{{- end }}
{{- range $name, $spec := .Values.externalsecrets.extraSecrets }}
{{- if $spec }}
{{- /* One Vault key per secret (tpl-rendered), fanned out by the env map (env var ->
    property, not tpl-rendered; null entries skipped). Map iteration is key-sorted,
    so the output is deterministic. */}}
{{- $secretName := printf "%s-%s" (include "..fullname" $) $name }}
{{- $key := tpl (required (printf "externalsecrets.extraSecrets.%s.key is required" $name) $spec.key | toString) $ }}
{{- $data := list }}
{{- range $env, $property := $spec.env }}
{{- if $property }}
{{- $data = append $data (dict "secretKey" $env "remoteRef" (dict "key" $key "property" $property)) }}
{{- end }}
{{- end }}
{{- if not $data }}
{{- fail (printf "externalsecrets.extraSecrets.%s.env needs at least one entry (environment variable -> property)" $name) }}
{{- end }}
---
# Additional secret, injected as environment variables into the Odoo container, the cron
# deployment and the init/update hook Jobs via ..envFromList — nothing mounts it as a file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}-secret
spec:
  secretStoreRef:
    name: {{ tpl ($.Values.externalsecrets.secretStoreRef.name | toString) $ }}
    kind: SecretStore
  target:
    name: {{ $secretName }}
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels: {}
  data:
  {{- toYaml $data | nindent 2 }}
{{- if or $.Values.odoo.init.enabled $.Values.odoo.update.enabled }}
---
# Hook copy for the init/update Jobs — same reasoning as <fullname>-odoo-conf-hook: the
# Jobs run at pre-install, before the normal ExternalSecret above exists, and an envFrom
# pointing at a missing Secret leaves the Job pod in CreateContainerConfigError. kubelet
# retries the lookup until the operator syncs this copy during the pre-install phase.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}-hook-secret
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  secretStoreRef:
    name: {{ tpl ($.Values.externalsecrets.secretStoreRef.name | toString) $ }}
    kind: SecretStore
  target:
    name: {{ $secretName }}-hook
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels: {}
  data:
  {{- toYaml $data | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
